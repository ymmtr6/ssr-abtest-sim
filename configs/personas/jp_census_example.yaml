id: jp_marginals_example
description: >
  Independent marginal weights for an illustrative Japanese adult audience.
  The filename matches the example layout; the numbers are rounded placeholders
  for a tutorial, not an extract from a census or any other official table.
source_note: >
  Replace these weights with published aggregate tables you are allowed to
  redistribute. Do not commit microdata. These placeholder weights are not
  official statistics.
