[project]
name = "ssr-abtest-sim"
version = "0.1.0"
description = "Screen web-page A/B variants with LLM personas and Semantic Similarity Rating."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Riku" }]
keywords = ["ab-test", "llm", "semantic-similarity-rating", "survey"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "openai>=1.58",
  "PyYAML>=6",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
screenshot = ["playwright>=1.40"]

[project.scripts]
ssr-abtest = "ssr_abtest.cli:main"

[project.urls]
Homepage = "https://github.com/ymmtr6/ssr-abtest-sim"
Documentation = "https://arxiv.org/abs/2510.08338"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
# Experiment prompts, the arXiv BibTeX export, and report sentences are
# kept intact rather than wrapped to satisfy a line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The BibTeX block is the exact arXiv export, including its trailing spaces.
"src/ssr_abtest/citation.py" = ["W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
